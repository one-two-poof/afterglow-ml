    - "보드카페"
    - "만화카페"
    - "키즈카페"
    - "이스케이프"
    - "방탈출"
    - "벌툰"

# ============ 시술 규칙 ============

treatment_rule:
  # 위반 시 차감할 페널티 점수 (장소당 1회 상한)
  penalty_score: -5.0

  # max_day: 시술일로부터 적용되는 일수 (예: 0~7일 -> max_day: 7)
  # action: "BLOCK" (후보군에서 즉시 제외), "PENALTY" (점수 차감)
  rules:
    "리프팅":
      high_activity:
        - { max_day: 2, action: "PENALTY" }
      outdoor_exposure:
        - { max_day: 7, action: "PENALTY" }
      heat_exposure:
        - { max_day: 7, action: "BLOCK" }
      massage_pressure:
        - { max_day: 7, action: "PENALTY" }

    "보톡스":
      high_activity:
        - { max_day: 0, action: "BLOCK" }
        - { max_day: 7, action: "PENALTY" }
      outdoor_exposure:
      heat_exposure:
        - { max_day: 7, action: "BLOCK" }
      massage_pressure:
        - { max_day: 7, action: "BLOCK" }

    "필러":
      high_activity:
        - { max_day: 7, action: "PENALTY" }
      outdoor_exposure:
      heat_exposure:
        - { max_day: 7, action: "BLOCK" }
      massage_pressure:
        - { max_day: 7, action: "BLOCK" }

    "스킨부스터":
      high_activity:
        - { max_day: 7, action: "PENALTY" }
      outdoor_exposure:
        - { max_day: 2, action: "BLOCK" }
        - { max_day: 7, action: "PENALTY" }
      heat_exposure:
        - { max_day: 7, action: "BLOCK" }
      massage_pressure:
        - { max_day: 7, action: "PENALTY" }

    "윤곽/체형주사":
      high_activity:
        - { max_day: 7, action: "PENALTY" }
      outdoor_exposure:
      heat_exposure:
        - { max_day: 7, action: "BLOCK" }
      massage_pressure:
        - { max_day: 7, action: "PENALTY" }

    "필링":
      high_activity:
        - { max_day: 7, action: "BLOCK" }
      outdoor_exposure:
        - { max_day: 7, action: "BLOCK" }
      heat_exposure:
        - { max_day: 7, action: "BLOCK" }
      massage_pressure:
        - { max_day: 3, action: "PENALTY" }

    "피부레이저":
      high_activity:
        - { max_day: 3, action: "PENALTY" }
      outdoor_exposure:
        - { max_day: 7, action: "BLOCK" }
      heat_exposure:
        - { max_day: 7, action: "BLOCK" }
      massage_pressure:
        - { max_day: 3, action: "PENALTY" }

    "피부관리":
      high_activity:
      outdoor_exposure:
      heat_exposure:
        - { max_day: 7, action: "PENALTY" }
      massage_pressure:

    "제모":
      high_activity:
      outdoor_exposure:
        - { max_day: 7, action: "BLOCK" }
      heat_exposure:
        - { max_day: 7, action: "BLOCK" }
      massage_pressure:

    "비만(약처방)":
      high_activity:
      outdoor_exposure:
      heat_exposure:
      massage_pressure:

# ============ 도보 선호도 규칙 ============

walk_preference_rule:
  # user_walk_preference와 place의 walk_hard 차이에 따른 점수 설정
  # 차이 = abs(user_walk_preference - walk_hard)
  score_mapping:
    0: 3.0     # 완벽히 일치
    1: 1.5     # 소폭 일치
    2: 0.0     # 중립 (영향 없음)
    3: -3.0    # 꽤 큰 불일치
    4: -5.0    # 극단적 불일치

# ============ 코스 다양성 (MMR) ============
# mmr = lambda * 정규화점수
#     + compactness_weight * 이전장소근접
#     - (1 - lambda) * penalty_scale * (카테고리유사도*w + 다른코스근접*w)

mmr_rule:
  lambda: 0.65
  penalty_scale: 1.2
  category_weight: 0.7
  compactness_weight: 1.2
  inter_course_weight: 0.4
  same_detail_similarity: 1.0
  same_category_similarity: 0.55
  near_km: 0.3                 # 코스 내부: 이 거리 이하면 밀집 가산 1.0
  far_km: 1.0                  # 코스 내부: 이 거리 이상이면 밀집 가산 0.0
  inter_course_near_km: 0.15   # 다른 코스와 이 거리 이하면 중복 벌점 1.0
  inter_course_far_km: 0.6     # 다른 코스와 이 거리 이상이면 중복 벌점 0.0

# ============ 방문 순서 슬롯 (목적별 소분류 키워드) ============
# place_category와 category_detail 부분 일치.
# 슬롯 키워드 장소가 slot_max_hop 이내면 그 슬롯을 우선하고,
# 없으면 같은 목적의 가까운 장소, 그것도 없으면 근처 장소로 대체한다.

course_flow_rule:
  reorder_distance_weight: 1.0
  default_purpose: "문화관광"
  # 슬롯 강제 매칭은 직전 장소(없으면 출발지) 기준 이 거리 이내일 때만.
  # 넘으면 같은 목적의 가까운 곳, 그것도 없으면 근처 장소로 대체한다.
  slot_max_hop_by_walk:
    1: 1.8
    2: 2.5
    3: 3.5
    4: 4.0
    5: 5.0
  purposes:
    "문화관광":
      early_shopping_penalty: -1.5
      shopping_keywords:
        - "올리브영"
        - "드럭스토어"
        - "백화점"
        - "화장품"
        - "패션"
      slots:
        1:
          bonus: 2.0
          keywords:
            - "미술관"
            - "전시"
            - "전시관"
            - "공연"
            - "공연장"
            - "박물관"
            - "영화관"
            - "테마파크"
            - "복합문화공간"
        2:
          bonus: 2.0
          keywords:
            - "테마거리"
            - "먹자골목"
            - "카페거리"
            - "숲"
            - "산"
            - "공원"
            - "도보여행"
            - "둘레길"
            - "전망대"
            - "산책"
        3:
          bonus: 2.5
          keywords:
            - "올리브영"
            - "드럭스토어"
            - "백화점"
            - "화장품"
            - "패션"
    "뷰티쇼핑":
      early_shopping_penalty: 0.0
      shopping_keywords: []
      skip_categories:
        - "마사지/경락/안마"
        - "스파"
        - "찜질방/사우나"
      slots:
        1:
