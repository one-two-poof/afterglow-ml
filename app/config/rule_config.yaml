# ============ 카테고리 규칙 ============

category_rule:
  weights:
    primary_match: 6.0    # 주력 카테고리(primary_category) 일치 시 가산점
    keyword_match: 3.0    # 상세 카테고리 키워드 포함 시 가산점
  
  purpose_primary_mapping:
    "뷰티쇼핑":
      - "드럭스토어"
      - "백화점"
    "문화관광":
      - "문화시설"
      - "관광명소"
    "휴식":
      - "문화시설"
      - "관광명소"

  purpose_keywords:
    "뷰티쇼핑":
      - "화장품"
      - "쇼핑"
      - "올리브영"
      - "백화점"
      - "뷰티"
    "문화관광":
      - "미술관"
      - "전시"
      - "공연"
      - "박물관"
      - "관광"
      - "명소"
      - "문화"
    "휴식":
      - "공원"
      - "산책"
      - "정원"
      - "힐링"
      - "휴식"

# ============ 시술 규칙 ============

treatment_rule:
  # 위반 시 차감할 페널티 점수
  penalty_score: -8.0

  # max_day: 시술일로부터 적용되는 일수 (예: 0~7일 -> max_day: 7)
  # action: "BLOCK" (후보군에서 즉시 제외), "PENALTY" (점수 차감)
  rules:
    "리프팅":
      high_activity:
        - { max_day: 2, action: "PENALTY" }
      outdoor_exposure:
        - { max_day: 7, action: "PENALTY" }
      heat_exposure:
        - { max_day: 7, action: "BLOCK" }
      massage_pressure:
        - { max_day: 7, action: "PENALTY" }

    "보톡스":
      high_activity:
        - { max_day: 0, action: "BLOCK" }
        - { max_day: 7, action: "PENALTY" }
      outdoor_exposure:
      heat_exposure:
        - { max_day: 7, action: "BLOCK" }
      massage_pressure:
        - { max_day: 7, action: "BLOCK" }

    "필러":
      high_activity:
        - { max_day: 7, action: "PENALTY" }
      outdoor_exposure:
      heat_exposure:
        - { max_day: 7, action: "BLOCK" }
      massage_pressure:
        - { max_day: 7, action: "BLOCK" }

    "스킨부스터":
      high_activity:
        - { max_day: 7, action: "PENALTY" }
      outdoor_exposure:
        - { max_day: 2, action: "BLOCK" }
        - { max_day: 7, action: "PENALTY" }
      heat_exposure:
        - { max_day: 7, action: "BLOCK" }
      massage_pressure:
        - { max_day: 7, action: "PENALTY" }

    "윤곽/체형주사":
      high_activity:
        - { max_day: 7, action: "PENALTY" }
      outdoor_exposure:
      heat_exposure:
        - { max_day: 7, action: "BLOCK" }
      massage_pressure:
        - { max_day: 7, action: "PENALTY" }

    "필링":
      high_activity:
        - { max_day: 7, action: "BLOCK" }
      outdoor_exposure:
        - { max_day: 7, action: "BLOCK" }
      heat_exposure:
        - { max_day: 7, action: "BLOCK" }
      massage_pressure:
        - { max_day: 3, action: "PENALTY" }

    "피부레이저":
      high_activity:
        - { max_day: 3, action: "PENALTY" }
      outdoor_exposure:
        - { max_day: 7, action: "BLOCK" }
      heat_exposure:
        - { max_day: 7, action: "BLOCK" }
      massage_pressure:
        - { max_day: 3, action: "PENALTY" }

    "피부관리":
