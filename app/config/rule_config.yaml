# ============ 카테고리 규칙 ============
# 목적 점수는 소분류만 본다.
# place_category(primaryTypeName)와 category_detail(categoryName)에
# 키워드가 하나라도 있으면 keyword_match를 1회 가산한다.

category_rule:
  weights:
    keyword_match: 8.0    # 소분류 키워드 일치 시 가산점

  purpose_keywords:
    "뷰티쇼핑":
      - "드럭스토어"
      - "올리브영"
      - "백화점"
      - "현대백화점"
      - "신세계백화점"
      - "롯데백화점"
      - "갤러리아백화점"
      - "화장품"
      - "패션"
      - "쇼핑"
      # [추후 데이터 확장 시 활성화 가능한 키워드]
      # - "아울렛"
      # - "면세점"
      # - "편집샵"
      # - "로드숍"
      # - "소품샵"
      # - "쇼핑몰"
      # - "코스메틱"
      # - "뷰티"
    "문화관광":
      - "미술관"
      - "전시관"
      - "전시"
      - "공연장"
      - "공연"
      - "연극극장"
      - "박물관"
      - "기념관"
      - "문화원"
      - "영화관"
      - "복합문화공간"
      - "아쿠아리움"
      - "테마파크"
      - "테마거리"
      - "먹자골목"
      - "카페거리"
      # [추후 데이터 확장 시 활성화 가능한 키워드]
      # - "유적지"
      # - "사찰"
      # - "역사"
      # - "고궁"
      # - "체험관"
      # - "야경"
      # - "랜드마크"
    "휴식":
      - "카페"
      - "공원"
      - "숲"
      - "산"
      - "도보여행"
      - "둘레길"
      - "전망대"
      - "섬"
      - "카페거리"
      - "산책"
      - "정원"
      - "스파"
      - "찜질방"
      - "사우나"
      - "마사지"
      # [추후 데이터 확장 시 활성화 가능한 키워드]
      # - "온천"
      # - "식물원"
      # - "수목원"
      # - "호수"
      # - "자연휴양림"

  # 소분류 키워드 매칭에서 제외. 보드/방탈출/키즈카페를 일반 카페로 보지 않는다.
