# ============ 시술 규칙 ============

treatment_rule:
  # 위반 시 차감할 페널티 점수 (장소당 1회 상한)
  penalty_score: -5.0

  # max_day: 시술일로부터 적용되는 일수 (예: 0~7일 -> max_day: 7)
  # action: "BLOCK" (후보군에서 즉시 제외), "PENALTY" (점수 차감)
  rules:
    "리프팅":
      high_activity:
        - { max_day: 2, action: "PENALTY" }
      outdoor_exposure:
        - { max_day: 7, action: "PENALTY" }
      heat_exposure:
        - { max_day: 7, action: "BLOCK" }
      massage_pressure:
        - { max_day: 7, action: "PENALTY" }

    "보톡스":
      high_activity:
        - { max_day: 0, action: "BLOCK" }
        - { max_day: 7, action: "PENALTY" }
      outdoor_exposure:
      heat_exposure:
        - { max_day: 7, action: "BLOCK" }
      massage_pressure:
        - { max_day: 7, action: "BLOCK" }

    "필러":
      high_activity:
        - { max_day: 7, action: "PENALTY" }
      outdoor_exposure:
      heat_exposure:
        - { max_day: 7, action: "BLOCK" }
      massage_pressure:
        - { max_day: 7, action: "BLOCK" }

    "스킨부스터":
      high_activity:
        - { max_day: 7, action: "PENALTY" }
      outdoor_exposure:
        - { max_day: 2, action: "BLOCK" }
        - { max_day: 7, action: "PENALTY" }
      heat_exposure:
        - { max_day: 7, action: "BLOCK" }
      massage_pressure:
        - { max_day: 7, action: "PENALTY" }

    "윤곽/체형주사":
      high_activity:
        - { max_day: 7, action: "PENALTY" }
      outdoor_exposure:
      heat_exposure:
        - { max_day: 7, action: "BLOCK" }
      massage_pressure:
        - { max_day: 7, action: "PENALTY" }

    "필링":
      high_activity:
        - { max_day: 7, action: "BLOCK" }
      outdoor_exposure:
        - { max_day: 7, action: "BLOCK" }
      heat_exposure:
        - { max_day: 7, action: "BLOCK" }
      massage_pressure:
        - { max_day: 3, action: "PENALTY" }

    "피부레이저":
      high_activity:
        - { max_day: 3, action: "PENALTY" }
      outdoor_exposure:
        - { max_day: 7, action: "BLOCK" }
      heat_exposure:
        - { max_day: 7, action: "BLOCK" }
      massage_pressure:
        - { max_day: 3, action: "PENALTY" }

    "피부관리":
      high_activity:
      outdoor_exposure:
      heat_exposure:
        - { max_day: 7, action: "PENALTY" }
      massage_pressure:

    "제모":
      high_activity:
      outdoor_exposure:
        - { max_day: 7, action: "BLOCK" }
      heat_exposure:
        - { max_day: 7, action: "BLOCK" }
      massage_pressure:

    "비만(약처방)":
      high_activity:
      outdoor_exposure:
      heat_exposure:
      massage_pressure:

# ============ 도보 선호도 규칙 ============

walk_preference_rule:
  # user_walk_preference와 place의 walk_hard 차이에 따른 점수 설정
  # 차이 = abs(user_walk_preference - walk_hard)
  score_mapping:
    0: 3.0     # 완벽히 일치
    1: 1.5     # 소폭 일치
    2: 0.0     # 중립 (영향 없음)
    3: -3.0    # 꽤 큰 불일치
    4: -5.0    # 극단적 불일치

# ============ 코스 다양성 (MMR) ============
# mmr = lambda * 정규화점수
#     + compactness_weight * 이전장소근접
#     - (1 - lambda) * penalty_scale * (카테고리유사도*w + 다른코스근접*w)

mmr_rule:
  lambda: 0.65
  penalty_scale: 1.2
  category_weight: 0.7
  compactness_weight: 1.2
  inter_course_weight: 0.4
  same_detail_similarity: 1.0
  same_category_similarity: 0.55
  near_km: 0.3                 # 코스 내부: 이 거리 이하면 밀집 가산 1.0
  far_km: 1.0                  # 코스 내부: 이 거리 이상이면 밀집 가산 0.0
  inter_course_near_km: 0.15   # 다른 코스와 이 거리 이하면 중복 벌점 1.0
  inter_course_far_km: 0.6     # 다른 코스와 이 거리 이상이면 중복 벌점 0.0
